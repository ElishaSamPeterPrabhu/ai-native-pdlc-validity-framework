<!doctype html>
<html lang="en" data-theme="modus-modern-light">
  <head>
    <meta charset="utf-8" />
    <title>Modus Capability Check</title>
    <!-- The plugin build must provide this pinned Modus bundle. -->
    <script src="modus-bundle.js"></script>
    <script src="capability-engine.js"></script>
    <style>
      :root {
        font-family: sans-serif;
      }

      body {
        margin: 0;
        padding: 16px;
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      #results {
        display: grid;
        gap: 8px;
      }

      .source {
        color: var(--modus-color-text-secondary);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      #runtime-status {
        border: 1px solid #b3261e;
        border-radius: 4px;
        color: #b3261e;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <div id="runtime-status" hidden></div>
    <main class="stack">
      <modus-wc-typography
        hierarchy="h5"
        label="Modus capability check"
      ></modus-wc-typography>
      <modus-wc-alert
        id="source-status"
        alert-title="Source"
        alert-description="Loading the official capability manifest…"
        variant="info"
        role="status"
      ></modus-wc-alert>
      <modus-wc-text-input
        id="query"
        label="Component, property, or state"
        placeholder="Try readonly or modus-wc-select"
        aria-label="Component, property, or state"
        include-clear
      ></modus-wc-text-input>
      <div class="actions">
        <modus-wc-button id="search" color="primary" variant="filled">
          Search
        </modus-wc-button>
        <modus-wc-button id="use-selection" color="secondary" variant="outlined">
          Use selection
        </modus-wc-button>
        <modus-wc-button id="refresh" color="tertiary" variant="borderless">
          Refresh
        </modus-wc-button>
      <modus-wc-button id="copy-handoff" color="secondary" variant="outlined">
        Copy handoff
      </modus-wc-button>
      </div>
      <modus-wc-card id="selection-card">
        <modus-wc-typography
          hierarchy="p"
          label="No Figma layer selected."
        ></modus-wc-typography>
      </modus-wc-card>
      <section id="results" aria-live="polite"></section>
      <modus-wc-card id="handoff-card" hidden>
        <span slot="title">Design handoff</span>
        <pre id="handoff"></pre>
      </modus-wc-card>
      <modus-wc-button id="close" color="tertiary" variant="outlined">
        Close
      </modus-wc-button>
    </main>

    <script>
      /*
       * Build note: modus-bundle.js must import
       * @trimble-oss/moduswebcomponents/modus-wc-styles.css and call
       * defineCustomElements(). The dependency version is intentionally chosen
       * by the plugin owner and must be locked in the plugin repository.
       */
      const MANIFEST_URL = "custom-elements.json";
      const CONTEXT_URL = "designer-context.json";
      const RULES_URL = "standards-rules.json";
      const CACHE_TTL_MS = 15 * 60 * 1000;
      let sourceCache = null;
      let manifest = null;
      let context = null;
      let rules = null;
      let selectedNode = null;
      let latestResult = null;

      const byId = (id) => document.getElementById(id);

      function showRuntimeError(message) {
        const status = byId("runtime-status");
        status.hidden = false;
        status.textContent = message;
      }

      function checkModusRuntime() {
        if (!customElements.get("modus-wc-button")) {
          showRuntimeError(
            "Modus UI did not initialize. Rebuild modus-bundle.js and reload the development plugin.",
          );
        }
      }

      window.addEventListener("modus-capability-ui-error", (event) => {
        showRuntimeError(`Modus UI bootstrap failed: ${event.detail}`);
      });
      window.addEventListener("modus-capability-ui-ready", () => {
        byId("runtime-status").hidden = true;
      });
      window.setTimeout(checkModusRuntime, 1500);

      function setSourceStatus(title, description, variant) {
        const status = byId("source-status");
        status.setAttribute("alert-title", title);
        status.setAttribute("alert-description", description);
        status.setAttribute("variant", variant);
      }

      function appendAlert(parent, title, description, variant) {
        const alert = document.createElement("modus-wc-alert");
        alert.setAttribute("alert-title", title);
        alert.setAttribute("alert-description", description);
        alert.setAttribute("variant", variant);
        alert.setAttribute("role", "status");
        parent.append(alert);
      }

      function appendContextCard(parent, title, value) {
        const card = document.createElement("modus-wc-card");
        const heading = document.createElement("modus-wc-typography");
        heading.setAttribute("slot", "title");
        heading.setAttribute("hierarchy", "h6");
        heading.setAttribute("label", title);
        const content = document.createElement("pre");
        content.textContent = value;
        card.append(heading, content);
        parent.append(card);
      }

      function sourceUrl(source) {
        if (String(source).startsWith("http")) return source;
        const filePath = String(source).split("#")[0];
        return `https://github.com/trimble-oss/modus-wc-2.0/blob/main/${filePath}`;
      }

      function appendSourceCard(parent, sources) {
        if (!sources.length) return;
        const card = document.createElement("modus-wc-card");
        const heading = document.createElement("modus-wc-typography");
        heading.setAttribute("slot", "title");
        heading.setAttribute("hierarchy", "h6");
        heading.setAttribute("label", "Sources");
        const list = document.createElement("ul");
        sources.forEach((source) => {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = sourceUrl(source);
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = source;
          item.append(link);
          list.append(item);
        });
        card.append(heading, list);
        parent.append(card);
      }

      function renderResults(query) {
        const results = byId("results");
        results.replaceChildren();
        byId("handoff-card").hidden = true;
        if (!query) {
          latestResult = null;
          setSourceStatus("Enter a search", "Search the current Modus context before designing a new state.", "info");
          return;
        }
        latestResult = window.ModusCapabilityEngine.buildResult({
          query,
          selectedNode,
          manifest,
          context,
          rules,
        });
        const capability = latestResult.modusCapability;
        const standards = latestResult.standards;
        const capabilityVariant =
          capability.status === "existing" ? "success" :
          capability.status === "source-stale" ? "error" : "warning";
        appendAlert(
          results,
          `Modus capability: ${capability.status}`,
          capability.matches.length
            ? capability.matches.map((match) => `${match.tag}${match.property ? ` / ${match.property}` : ""} (${match.source})`).join("; ")
            : "No exact manifest entry was found. This is a research gap, not proof that the design is impossible.",
          capabilityVariant,
        );
        if (standards.status !== "unknown") {
          const ruleText = standards.rules.map((rule) => `${rule.title}: ${rule.message}`).join(" ");
          appendAlert(
            results,
            `Standards/design constraint: ${standards.status}`,
            ruleText || "No curated standards constraint matched this request.",
            standards.status === "unsupported" ? "warning" : "info",
          );
        }
        if (capability.context) {
          appendContextCard(
            results,
            "Repository context",
            JSON.stringify({
              sourceCommit: capability.context.sourceCommit,
              stateMatrix: capability.context.stateMatrix,
              tokenHints: capability.context.tokenHints,
              precedent: capability.context.precedent,
              impact: capability.context.impact,
            }, null, 2),
          );
        }
        if (standards.alternatives.length) {
          appendContextCard(
            results,
            "Suggested options",
            standards.alternatives.map((alternative) => `${alternative.title}: ${alternative.description}`).join("\n"),
          );
        }
        appendSourceCard(results, latestResult.sources);
        const handoff = byId("handoff");
        handoff.textContent = latestResult.handoff.markdown;
        byId("handoff-card").hidden = false;
      }

      async function loadManifest(forceRefresh = false) {
        const cached = sourceCache;
        if (!forceRefresh && cached && Date.now() - cached.savedAt < CACHE_TTL_MS) {
          manifest = cached.manifest;
          context = cached.context;
          rules = cached.rules;
          setSourceStatus("Source ready", "Cached Modus context; refresh to check for updates.", "success");
          return;
        }
        try {
          const [manifestResult, contextResult, rulesResult] = await Promise.allSettled([
            fetch(MANIFEST_URL, { cache: "no-store" }),
            fetch(CONTEXT_URL, { cache: "no-store" }),
            fetch(RULES_URL, { cache: "no-store" }),
          ]);
          if (manifestResult.status !== "fulfilled" || !manifestResult.value.ok) {
            throw new Error(
              manifestResult.status === "fulfilled"
                ? `Manifest HTTP ${manifestResult.value.status}`
                : manifestResult.reason?.message || "Manifest unavailable",
            );
          }
          manifest = await manifestResult.value.json();
          context = contextResult.status === "fulfilled" && contextResult.value.ok
            ? await contextResult.value.json()
            : null;
          rules = rulesResult.status === "fulfilled" && rulesResult.value.ok
            ? await rulesResult.value.json()
            : { rules: [] };
          sourceCache = {
            savedAt: Date.now(),
            manifest,
            context,
            rules,
          };
          const missingSources = [
            context ? "" : "shared context",
            rules.rules.length ? "" : "standards rules",
          ].filter(Boolean);
          setSourceStatus(
            missingSources.length ? "Source partially available" : "Source ready",
            missingSources.length
              ? `Manifest loaded, but ${missingSources.join(" and ")} could not be verified.`
              : `Manifest and shared context loaded at commit ${context.sourceCommit || "unknown"}.`,
            missingSources.length ? "warning" : "success",
          );
        } catch (error) {
          manifest = null;
          context = null;
          rules = { rules: [] };
          setSourceStatus("Source unavailable", `${error.message}. The plugin cannot verify capability or suggest options.`, "error");
        }
      }

      function showSelection(node) {
        selectedNode = node;
        const card = byId("selection-card");
        card.replaceChildren();
        const text = document.createElement("modus-wc-typography");
        text.setAttribute("hierarchy", "p");
        text.setAttribute(
          "label",
          node
          ? `Selected: ${node.name} (${node.type})`
          : "No Figma layer selected.",
        );
        card.append(text);
      }

      byId("search").addEventListener("buttonClick", () => {
        renderResults(byId("query").value || "");
      });
      byId("refresh").addEventListener("buttonClick", async () => {
        await loadManifest(true);
        renderResults(byId("query").value || "");
      });
      byId("copy-handoff").addEventListener("buttonClick", async () => {
        if (!latestResult) return;
        try {
          await navigator.clipboard.writeText(latestResult.handoff.markdown);
          setSourceStatus("Handoff copied", "Paste the cited handoff into the sheet design notes or issue context.", "success");
        } catch (error) {
          setSourceStatus("Copy unavailable", `${error.message}. Select the handoff text manually.`, "warning");
        }
      });
      byId("use-selection").addEventListener("buttonClick", () => {
        if (!selectedNode) return;
        byId("query").value = selectedNode.name;
        renderResults(selectedNode.name);
      });
      byId("close").addEventListener("buttonClick", () => {
        parent.postMessage({ pluginMessage: { type: "close" } }, "*");
      });
      window.onmessage = (event) => {
        if (event.data.pluginMessage?.type === "selection") {
          showSelection(event.data.pluginMessage.node);
        }
      };

      loadManifest();
    </script>
  </body>
</html>
