<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Validity Dashboard</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef;
    --dim: #8b93a3; --good: #34c759; --warn: #f5a623; --bad: #ff453a;
    --accent: #5aa9ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 19px; margin: 0; font-weight: 650; }
  header .meta { color: var(--dim); font-size: 13px; }
  main { padding: 20px 24px; display: grid; gap: 18px;
         grid-template-columns: 340px 1fr; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
              color: var(--dim); margin: 0 0 12px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 4px 6px; }
  td { padding: 5px 6px; border-top: 1px solid var(--line); }
  tr.run { cursor: pointer; }
  tr.run:hover { background: #1d2230; }
  tr.selected { background: #1d2a44; }
  .gauge-wrap { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .gauge { position: relative; width: 170px; height: 170px; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .value { position: absolute; inset: 0; display: flex; flex-direction: column;
                  align-items: center; justify-content: center; }
  .gauge .value b { font-size: 32px; }
  .gauge .value span { color: var(--dim); font-size: 12px; }
  .verdict { padding: 6px 14px; border-radius: 999px; font-weight: 650;
             font-size: 14px; display: inline-block; }
  .verdict.merge-worthy { background: rgba(52,199,89,.15); color: var(--good); }
  .verdict.review-carefully { background: rgba(245,166,35,.15); color: var(--warn); }
  .verdict.abandon { background: rgba(255,69,58,.15); color: var(--bad); }
  #vchart, #termchart { width: 100%; height: 230px; }
  .bars { display: grid; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 120px 1fr 46px; gap: 8px;
             align-items: center; font-size: 13px; }
  .bar { height: 10px; border-radius: 5px; background: var(--line);
         overflow: hidden; }
  .bar > div { height: 100%; border-radius: 5px; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Agent Validity Dashboard</h1>
  <span class="meta" id="meta">loading…</span>
</header>
<main>
  <section class="panel">
    <h2>Fleet — runs &amp; pass^k</h2>
    <div id="fleet" class="empty">No runs yet. Run the pilot, then
      <code>collectors.py</code>, and refresh.</div>
  </section>
  <section style="display:grid;gap:18px">
    <div class="panel">
      <h2>Selected run — delivered validity</h2>
      <div id="runhead" class="empty">Select a run from the fleet list.</div>
    </div>
    <div class="panel">
      <h2>V(t): observed vs formula</h2>
      <canvas id="vchart"></canvas>
    </div>
    <div class="panel">
      <h2>What is eating validity (decay parts at last checkpoint)</h2>
      <div id="terms" class="bars"></div>
    </div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let selected = null;

async function loadSummary() {
  const s = await fetch('/api/summary').then(r => r.json());
  $('#meta').textContent =
    `formula ${s.formula_version} · ${s.total_runs} runs collected`;
  if (!s.runs.length) return;
  const taskRows = s.tasks.map(t =>
    `<tr><td>${t.task}</td><td>${t.runs}</td><td>${fmt(t.pass_rate)}</td>
     <td>${fmt(t.pass_hat_k)}</td></tr>`).join('');
  const runRows = s.runs.map(r =>
    `<tr class="run" data-tag="${r.run_tag}">
       <td>${r.run_tag}</td>
       <td><span class="pill">${r.terminal_state ?? '—'}</span></td>
       <td>${fmt(r.final_v_obs)}</td></tr>`).join('');
  $('#fleet').classList.remove('empty');
  $('#fleet').innerHTML = `
    <table><thead><tr><th>task</th><th>runs</th><th>pass@1</th><th>pass^k</th></tr>
    </thead><tbody>${taskRows}</tbody></table>
    <h2 style="margin-top:16px">Runs</h2>
    <table><thead><tr><th>run</th><th>state</th><th>V_end</th></tr></thead>
    <tbody>${runRows}</tbody></table>`;
  document.querySelectorAll('tr.run').forEach(tr =>
    tr.addEventListener('click', () => selectRun(tr.dataset.tag, tr)));
  if (!selected && s.runs[0]) selectRun(s.runs[0].run_tag, null);
}

function fmt(x) { return (x === null || x === undefined) ? '—' : Number(x).toFixed(2); }

async function selectRun(tag, tr) {
  selected = tag;
  document.querySelectorAll('tr.run').forEach(r => r.classList.remove('selected'));
  if (tr) tr.classList.add('selected');
  const d = await fetch('/api/run/' + encodeURIComponent(tag)).then(r => r.json());
  if (d.error) return;
  renderHead(d); renderChart(d); renderTerms(d);
}

function gauge(v) {
  const pct = Math.max(0, Math.min(1, v));
  const R = 70, C = 2 * Math.PI * R;
  const color = pct >= 0.65 ? 'var(--good)' : pct >= 0.3 ? 'var(--warn)' : 'var(--bad)';
  return `<div class="gauge">
    <svg width="170" height="170">
      <circle cx="85" cy="85" r="${R}" fill="none" stroke="var(--line)" stroke-width="14"/>
      <circle cx="85" cy="85" r="${R}" fill="none" stroke="${color}" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="${C * pct} ${C}"/>
    </svg>
    <div class="value"><b>${(pct).toFixed(2)}</b><span>V_delivered</span></div>
  </div>`;
}

function renderHead(d) {
  $('#runhead').classList.remove('empty');
  const st = Object.entries(d.stage_transitions || {})
    .map(([k, v]) => `<tr><td>${k}</td><td>${v ?? '—'}</td></tr>`).join('');
  $('#runhead').innerHTML = `
    <div class="gauge-wrap">
      ${gauge(d.v_delivered)}
      <div>
        <div style="font-size:16px;font-weight:650;margin-bottom:6px">${d.run_tag}</div>
        <div class="meta" style="color:var(--dim);margin-bottom:10px">
          arm <b>${d.arm}</b> · task <b>${d.task}</b> ·
          state <b>${d.terminal_state}</b> · fix iterations ${d.fix_iterations}
          · V_end ${fmt(d.v_end)}</div>
        <span class="verdict ${d.verdict}">${d.verdict}</span>
      </div>
    </div>
    ${st ? `<table style="margin-top:14px"><thead><tr><th>pipeline event</th>
      <th>at</th></tr></thead><tbody>${st}</tbody></table>` : ''}`;
}

function renderChart(d) {
  const cv = $('#vchart');
  const ctx = cv.getContext('2d');
  const W = cv.width = cv.clientWidth * devicePixelRatio;
  const H = cv.height = cv.clientHeight * devicePixelRatio;
  ctx.clearRect(0, 0, W, H);
  const pts = d.points || [];
  if (!pts.length) return;
  const pad = 34 * devicePixelRatio;
  const tmax = Math.max(...pts.map(p => p.t), 1e-6);
  const x = t => pad + (W - 2 * pad) * (t / tmax);
  const y = v => H - pad - (H - 2 * pad) * v;
  ctx.strokeStyle = '#262b36'; ctx.lineWidth = 1;
  [0, .5, 1].forEach(g => { ctx.beginPath(); ctx.moveTo(pad, y(g));
    ctx.lineTo(W - pad, y(g)); ctx.stroke(); });
  ctx.fillStyle = '#8b93a3';
  ctx.font = `${11 * devicePixelRatio}px system-ui`;
  [0, .5, 1].forEach(g => ctx.fillText(g.toFixed(1), 6 * devicePixelRatio, y(g) + 4));
  // model line
  ctx.strokeStyle = '#5aa9ff'; ctx.lineWidth = 2 * devicePixelRatio;
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(x(p.t), y(p.v_model)) : ctx.moveTo(x(p.t), y(p.v_model)));
  ctx.stroke();
  // observed dots
  ctx.fillStyle = '#34c759';
  pts.filter(p => p.v_obs !== null && p.v_obs !== undefined).forEach(p => {
    ctx.beginPath(); ctx.arc(x(p.t), y(p.v_obs), 4 * devicePixelRatio, 0, 7); ctx.fill();
  });
  ctx.fillStyle = '#8b93a3';
  ctx.fillText('blue = formula prediction · green dots = verifier V_obs', pad, 14 * devicePixelRatio);
}

function renderTerms(d) {
  const last = (d.terms || []).slice(-1)[0];
  if (!last) { $('#terms').innerHTML = '<div class="empty">no checkpoints</div>'; return; }
  const rows = Object.entries(last.decay_parts).map(([k, v]) => `
    <div class="bar-row"><span>${k.replace('_', ' ')}</span>
      <div class="bar"><div style="width:${(v * 100).toFixed(0)}%;
        background:var(--bad)"></div></div><span>${v.toFixed(2)}</span></div>`);
  rows.push(`
    <div class="bar-row"><span><b>recovery R</b></span>
      <div class="bar"><div style="width:${Math.min(100, last.recovery * 100).toFixed(0)}%;
        background:var(--good)"></div></div><span>${last.recovery.toFixed(2)}</span></div>`);
  rows.push(`
    <div class="bar-row"><span><b>decay D</b></span>
      <div class="bar"><div style="width:${Math.min(100, last.decay * 100).toFixed(0)}%;
        background:var(--bad)"></div></div><span>${last.decay.toFixed(2)}</span></div>`);
  $('#terms').innerHTML = rows.join('');
}

loadSummary();
setInterval(loadSummary, 30000);
</script>
</body>
</html>
